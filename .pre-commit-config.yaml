repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      # Notebooks in examples/ are committed without outputs on purpose:
      # they are documentation, and stored outputs would carry machine-specific
      # paths and version banners into the repository.
      - id: check-json

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff-format
        files: ^(src|tests)/
      - id: ruff
        args: [--fix]
        files: ^(src|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.14.1
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: [pandas-stubs, types-setuptools]
        args: [--ignore-missing-imports]

  - repo: local
    hooks:
      - id: no-licence-material
        name: refuse licence keys and commercial binaries
        entry: python scripts/check_no_licence_material.py
        language: system
        pass_filenames: true
